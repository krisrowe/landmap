<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Land Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3b2d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css" crossorigin="">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="map"></div>

<button id="btn-menu" aria-label="Menu" title="Menu">&#9776;</button>
<button id="btn-home" aria-label="Back to the property" title="Back to the property">&#8982;</button>
<div id="menu" hidden>
  <div id="menu-layers" aria-label="Layers"></div>
  <button id="menu-offline" title="Save map tiles for offline use">Offline map</button>
  <button id="menu-signin">Sign in</button>
  <button id="menu-signout" hidden>Sign out</button>
</div>

<div id="toolbar">
  <button id="btn-locate" title="Show where I am">Locate</button>
  <button id="btn-teleport" class="teleport" title="Stop pretending to be at the tapped spot" hidden>Teleported · end</button>
  <button id="btn-pin" class="primary" title="Pin the spot I am standing on" hidden>Pin here</button>
</div>
<div id="status" hidden></div>

<div id="signin-sheet" hidden>
  <form id="signin-form">
    <h2>Sign in</h2>
    <p class="muted">Pins are private. Enter the access key to see and edit them.</p>
    <label>Access key <input id="signin-key" type="password" autocomplete="current-password" required></label>
    <div class="row">
      <button type="button" id="signin-cancel">Cancel</button>
      <button type="submit" class="primary">Sign in</button>
    </div>
  </form>
</div>

<div id="spot-sheet" hidden>
  <h2 id="spot-in">This spot</h2>
  <button type="button" id="spot-fix" class="copyable" title="Copy coordinates"></button>
  <div class="row">
    <button type="button" id="spot-cancel">Cancel</button>
    <button type="button" id="spot-teleport">Put me here</button>
    <button type="button" id="spot-pin" class="primary">Pin here</button>
  </div>
</div>

<div id="sheet" hidden>
  <form id="pin-form">
    <h2 id="sheet-title">New pin</h2>
    <p id="sheet-fix" class="muted"></p>
    <label>Label <input id="pin-label" name="label" maxlength="120" required autocomplete="off"></label>
    <label>Note <textarea id="pin-note" name="note" rows="2" maxlength="2000"></textarea></label>
    <div class="row">
      <button type="button" id="pin-cancel">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</div>

<script src="/static/vendor/leaflet/leaflet.js" crossorigin=""></script>
<script src="/static/app.js"></script>
</body>
</html>
